<style>

    --warning: #c98500;
    --critical: #d03b3b;

    --warning-bg: #fbedcf;
    --critical-bg: #fae2e1;
    --neutral-bg: #ecebe6;
    --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 10px 28px rgba(11,11,11,0.06);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {

      --surface-3: #292927;

      --ink-2: #c3c2b7;
      --ink-muted: #8f8d86;
      --border: rgba(255,255,255,0.11);
      --border-strong: rgba(255,255,255,0.18);
      --accent: #5b9ee8;
      --accent-ink: #08131f;

      --good: #2fbf4f;
      --warning: #f0ac2e;
      --critical: #ea6a6a;
      --good-bg: rgba(47,191,79,0.14);
      --warning-bg: rgba(240,172,46,0.14);
      --critical-bg: rgba(234,106,106,0.15);

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  h1, h2, h3, p { margin: 0; text-wrap: balance; }
  .mono { font-family: var(--mono); }

  /* ---------- shared bits ---------- */
  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .icon { width: 15px; height: 15px; flex: none; display: block; }
  .icon-lg { width: 20px; height: 20px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px 4px 8px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 650;
    line-height: 1.5;
    white-space: nowrap;
  }
  .pill--good    { background: var(--good-bg);     color: var(--ink); }
  .pill--good    .icon { color: var(--good); }
  .pill--warning { background: var(--warning-bg);  color: var(--ink); }
  .pill--warning .icon { color: var(--warning); }
  .pill--critical{ background: var(--critical-bg); color: var(--ink); }
  .pill--critical .icon { color: var(--critical); }
  .pill--neutral {
    background: var(--neutral-bg);
    color: var(--ink-2);
    font-weight: 600;
  }
  .pill--neutral .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted); }

  .pill-lg { padding: 8px 18px 8px 12px; font-size: 15px; border-radius: 999px; }
  .pill-lg .icon { width: 18px; height: 18px; }

  /* ---------- hero ---------- */
  .hero {
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  .hero-title-block { display: flex; flex-direction: column; gap: 8px; }
  .hero-title {
    font-size: 26px;
    font-weight: 750;
    letter-spacing: -0.01em;
  }
  .hero-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hero-status-label { font-size: 11.5px; color: var(--ink-muted); font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }

  .sprint-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .sprint-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .sprint-chip b { color: var(--ink); font-weight: 650; }
  .sprint-chip .mono { color: var(--ink); }

  .sprint-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sprint-col {
    padding: 12px 14px;
    border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sprint-col-team { font-size: 13px; font-weight: 650; color: var(--ink); }
  .sprint-col-id { font-size: 12px; color: var(--ink-2); }
  .sprint-col-dates { font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- stat strip ---------- */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .stat-tile {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat-value {
    font-size: 34px;
    font-weight: 750;
    letter-spacing: -0.01em;
    display: flex;
    align-items: baseline;
    gap: 6px;

  .stat-value small { font-size: 16px; font-weight: 600; color: var(--ink-muted); }
  .stat-label { font-size: 12.5px; color: var(--ink-2); }
  .stat-tile.accent { background: linear-gradient(180deg, var(--accent-tint), var(--surface) 70%); }
  .stat-tile.accent .stat-value { color: var(--accent); }

  .stat-cards {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .stat-cards-empty {
    font-size: 12px;
    color: var(--ink-muted);
    font-style: italic;
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);

  .stat-chip {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 12px;

  .stat-chip .mono { font-size: 11px; color: var(--ink-2); flex: none; }
  .stat-chip-title {
    color: var(--ink);
    font-weight: 550;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;

  .section-title { font-size: 17px; font-weight: 700; letter-spacing: -0.005em; }
  .section-note { font-size: 12.5px; color: var(--ink-muted); }

  /* ---------- legend ---------- */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }

  .legend-item.good .icon { color: var(--good); }
  .legend-item.warning .icon { color: var(--warning); }
  .legend-item.critical .icon { color: var(--critical); }

  /* ---------- team grid ---------- */
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .team-card { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .team-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .team-name { font-size: 16px; font-weight: 700; }
  .team-goal { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; max-width: 42ch; }

  .team-bar {
    display: flex;
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-3);
    gap: 2px;
  }
  .team-bar-seg { height: 100%; }
  .team-bar-seg.good { background: var(--good); }
  .team-bar-seg.warning { background: var(--warning); }
  .team-bar-seg.critical { background: var(--critical); }
  .team-bar-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-muted); }

  .team-meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-muted); }
  .team-meta-row .mono { color: var(--ink-2); }

  .at-risk-list { display: flex; flex-direction: column; gap: 10px; }
  .at-risk-card {
    padding: 12px 13px;
    border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .at-risk-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .at-risk-card-id { font-size: 12.5px; }
  .at-risk-card-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .at-risk-reasons { display: flex; flex-direction: column; gap: 4px; }
  .at-risk-reasons li { font-size: 12.5px; color: var(--ink-2); list-style: none; padding-left: 13px; position: relative; }
  .at-risk-reasons li::before { content: "·"; position: absolute; left: 2px; color: var(--ink-muted); font-weight: 900; }
  .all-clear { font-size: 12.5px; color: var(--ink-muted); padding: 4px 0; }

  /* ---------- gap table ---------- */
  .gap-wrap { overflow-x: auto; }
  .gap-table { width: 100%; border-collapse: collapse; min-width: 880px; }
  .gap-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  .gap-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 13px;
  }
  .gap-table tbody tr:hover { background: var(--surface-2); }
  .gap-table tr.done-row { opacity: 0.62; }
  .gap-table tr.done-row:hover { opacity: 1; }
  .cell-card { display: flex; flex-direction: column; gap: 2px; }
  .cell-card .title { font-weight: 600; color: var(--ink); font-size: 13px; }
  .cell-flow { display: flex; align-items: center; gap: 8px; }
  .cell-flow .icon { color: var(--ink-muted); width: 13px; height: 13px; }
  .cell-reasons { display: flex; flex-direction: column; gap: 4px; max-width: 360px; }
  .cell-reasons li { font-size: 12.5px; color: var(--ink-2); list-style: none; padding-left: 12px; position: relative; }
  .cell-reasons li::before { content: "·"; position: absolute; left: 1px; color: var(--ink-muted); font-weight: 900; }
  .no-gap-note { font-size: 12.5px; color: var(--ink-muted); font-style: italic; }
  .pr-meta { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-muted); }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
    padding-top: 12px;
  }
  footer a { color: inherit; }

  @media (max-width: 620px) {
    .page { padding: 24px 14px 60px; }
    .hero { padding: 22px 18px; }
    .hero-status { align-items: flex-start; }
    .hero-top { flex-direction: column; }
    .sprint-columns { grid-template-columns: 1fr; }
  }
</style>

    opts = opts || {};
    var meta = STATUS[status];
    var size = opts.size === "lg" ? " pill-lg" : "";
    var label = opts.label || (meta.word + (opts.withDesc ? " · " + meta.desc : ""));
    return '<span class="pill pill--' + meta.key + size + '">' + meta.icon + '<span>' + label + '</span></span>';
  }

  function neutralPill(text) {
    return '<span class="pill pill--neutral"><span class="dot"></span><span>' + text + '</span></span>';
  }

  function reasonsList(reasons, cls) {
    if (!reasons || !reasons.length) return "";
    var lis = reasons.map(function (r) { return "<li>" + escapeHtml(r) + "</li>"; }).join("");
    return '<ul class="' + cls + '">' + lis + "</ul>";
  }

  function prMetaLine(card) {
    if (!card || !card.pr_id) {
      return '<div class="pr-meta"><span class="mono">No PR yet</span></div>';
    }
    return '<div class="pr-meta">' +
      '<span class="mono">' + card.pr_id + '</span>' +
      '<span>' + card.pr_state + ' &middot; <b>' + card.pr_size + '</b> PR</span>' +
      '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function daysBetween(a, b) {
    var A = new Date(a + "T00:00:00Z");
    var B = new Date(b + "T00:00:00Z");
    return Math.round((B - A) / 86400000);
  }

  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  }

  var app = document.getElementById("app");

  /* ---------------- hero ---------------- */
  var progMeta = STATUS[DATA.program.status];
  var daysLeft = Math.min.apply(null, DATA.teams.map(function (t) { return daysBetween(DATA.as_of, t.sprint_end); }));

  var hero = el("section", "hero card");
  hero.innerHTML =
    '<div class="hero-top">' +
      '<div class="hero-title-block">' +
        '<div class="eyebrow">Sprint Confidence Gap Analyzer &middot; Program Report</div>' +
        '<div class="hero-title">All 3 teams &middot; active sprints</div>' +
      '</div>' +
      '<div class="hero-status">' +
        '<div class="hero-status-label">Program status</div>' +
        statusPill(DATA.program.status, { size: "lg", withDesc: true }) +
      '</div>' +
    '</div>' +
    '<div class="sprint-chips">' +
      '<span class="sprint-chip">' + ICONS.clock + '<span>As of <b>' + fmtDate(DATA.as_of) + '</b></span></span>' +
      '<span class="sprint-chip">' + ICONS.flag + '<span><b>' + daysLeft + ' day' + (daysLeft === 1 ? "" : "s") + '</b> left in every active sprint</span></span>' +
    '</div>' +
    '<div class="sprint-columns">' +
      DATA.teams.map(function (t) {
        return '<div class="sprint-col">' +
          '<div class="sprint-col-team">' + escapeHtml(t.team_name) + '</div>' +
          '<div class="sprint-col-id mono">' + t.sprint_id + '</div>' +
          '<div class="sprint-col-dates">' + fmtDate(t.sprint_start) + '&ndash;' + fmtDate(t.sprint_end) + '</div>' +
        '</div>';
      }).join("") +
    '</div>';
  app.appendChild(hero);

  /* ---------------- confidence gap stat strip ---------------- */
  var inProgress = DATA.cards.filter(function (c) { return c.card_status !== "done"; });
  var gapped = inProgress.filter(function (c) { return c.status !== "Green"; });
  var redCards = DATA.cards.filter(function (c) { return c.status === "Red"; });
  var amberCards = DATA.cards.filter(function (c) { return c.status === "Amber"; });
  var greenCards = DATA.cards.filter(function (c) { return c.status === "Green"; });

  function cardChips(cards, tint) {
    if (!cards.length) return '<div class="stat-cards-empty">None</div>';
    return '<div class="stat-cards">' + cards.map(function (c) {
      return '<span class="stat-chip" style="background:' + tint + '" title="' + escapeHtml(c.title) + '">' +
        '<span class="mono">' + c.card_id + '</span><span class="stat-chip-title">' + escapeHtml(c.title) + '</span>' +
        '</span>';
    }).join("") + '</div>';
  }

  var stripWrap = el("section", "card");
  stripWrap.style.padding = "22px 24px";
  stripWrap.innerHTML =
    '<div class="section-head" style="margin-bottom:16px;">' +
      '<div class="section-title">The confidence gap, right now</div>' +
      '<div class="section-note">Cards marked &ldquo;In Progress&rdquo; on the board vs. what PR &amp; risk signals actually say</div>' +
    '</div>' +
    '<div class="stat-strip">' +
      '<div class="stat-tile accent">' +
        '<div class="stat-value">' + gapped.length + '<small>&nbsp;of ' + inProgress.length + '</small></div>' +
        '<div class="stat-label">in-progress cards look fine on the board but carry a Red or Amber signal</div>' +
        cardChips(gapped, "var(--accent-tint)") +
      '</div>' +
      '<div class="stat-tile">' +
        '<div class="stat-value" style="color:var(--critical)">' + redCards.length + '</div>' +
        '<div class="stat-label">cards Red &mdash; a hard-fail signal: failing quality gate, merge conflict, or an active High-priority risk</div>' +
        cardChips(redCards, "var(--critical-bg)") +
      '</div>' +
      '<div class="stat-tile">' +
        '<div class="stat-value" style="color:var(--warning)">' + amberCards.length + '</div>' +
        '<div class="stat-label">cards Amber &mdash; one or more soft-risk signals worth a look before standup</div>' +
        cardChips(amberCards, "var(--warning-bg)") +
      '</div>' +
      '<div class="stat-tile">' +
        '<div class="stat-value" style="color:var(--good)">' + greenCards.length + '</div>' +
        '<div class="stat-label">cards Green &mdash; clean across every PR and risk signal</div>' +
        cardChips(greenCards, "var(--good-bg)") +
      '</div>' +
    '</div>';
  app.appendChild(stripWrap);

  /* ---------------- legend ---------------- */
  var legend = el("div", "legend");
  legend.innerHTML =
    '<span class="legend-item good">' + ICONS.check + '<span>Green &mdash; on track</span></span>' +
    '<span class="legend-item warning">' + ICONS.warn + '<span>Amber &mdash; watch</span></span>' +
    '<span class="legend-item critical">' + ICONS.x + '<span>Red &mdash; at risk</span></span>';
  app.appendChild(legend);

  /* ---------------- team grid ---------------- */
  var teamsHead = el("div", "section-head");
  teamsHead.innerHTML = '<div class="section-title">By team</div><div class="section-note">Worst-card-wins status per team</div>';
  app.appendChild(teamsHead);

  var teamsGrid = el("div", "teams-grid");
  DATA.teams.forEach(function (t) {
    var total = t.counts.Red + t.counts.Amber + t.counts.Green;
    var seg = function (n, cls) {
      return n > 0 ? '<span class="team-bar-seg ' + cls + '" style="flex:' + n + '" title="' + n + '"></span>' : "";
    };
    var card = el("div", "team-card card");
    card.innerHTML =
      '<div class="team-card-head">' +
        '<div>' +
          '<div class="team-name">' + escapeHtml(t.team_name) + '</div>' +
          '<div class="team-goal">' + escapeHtml(t.sprint_goal) + '</div>' +
        '</div>' +
        statusPill(t.status) +
      '</div>' +
      '<div>' +
        '<div class="team-bar">' + seg(t.counts.Red, "critical") + seg(t.counts.Amber, "warning") + seg(t.counts.Green, "good") + '</div>' +
        '<div class="team-bar-caption"><span>' + t.counts.Red + ' Red &middot; ' + t.counts.Amber + ' Amber &middot; ' + t.counts.Green + ' Green</span><span>' + total + ' cards</span></div>' +
      '</div>' +
      '<div class="team-meta-row">' +
        '<span class="mono">' + t.sprint_id + '</span>' +
        '<span>' + fmtDate(t.sprint_start) + '&ndash;' + fmtDate(t.sprint_end) + '</span>' +
        '<span>Velocity ' + t.velocity + '</span>' +
      '</div>' +
      '<div class="at-risk-list"></div>';

    var list = card.querySelector(".at-risk-list");
    if (t.at_risk_cards.length === 0) {
      list.innerHTML = '<div class="all-clear">' + ICONS.check + ' No at-risk cards this sprint.</div>';
    } else {
      t.at_risk_cards.forEach(function (c) {
        var item = el("div", "at-risk-card");
        item.innerHTML =
          '<div class="at-risk-card-head">' +
            '<div><span class="mono at-risk-card-id">' + c.card_id + '</span></div>' +
            statusPill(c.status) +
          '</div>' +
          '<div class="at-risk-card-title">' + escapeHtml(c.title) + '</div>' +
          prMetaLine(cardById[c.card_id]) +
          reasonsList(c.reasons, "at-risk-reasons");
        list.appendChild(item);
      });
    }
    teamsGrid.appendChild(card);
  });
  app.appendChild(teamsGrid);

  /* ---------------- gap analysis table ---------------- */
  var tableHead = el("div", "section-head");
  tableHead.innerHTML = '<div class="section-title">Gap analysis &mdash; every card</div><div class="section-note">Board status vs. computed signal, with the specific reasons behind every flag</div>';
  app.appendChild(tableHead);

  var order = { Red: 0, Amber: 1, Green: 2 };
  var sorted = DATA.cards.slice().sort(function (a, b) {
    var doneA = a.card_status === "done" ? 1 : 0;
    var doneB = b.card_status === "done" ? 1 : 0;
    if (doneA !== doneB) return doneA - doneB;
    return order[a.status] - order[b.status];
  });

  var tableWrap = el("div", "card gap-wrap");
  tableWrap.style.padding = "6px 8px 12px";
  var table = el("table", "gap-table");
  table.innerHTML =
    "<thead><tr>" +
      "<th>Card</th><th>Team &middot; feature</th><th>Board status</th><th></th><th>Signal</th><th>PR</th><th>Why</th>" +
    "</tr></thead>";
  var tbody = el("tbody");

  sorted.forEach(function (c) {
    var isDone = c.card_status === "done";
    var tr = el("tr", isDone ? "done-row" : "");
    var boardLabel = isDone ? "Done" : "In Progress";
    var prCell = prMetaLine(c);

    var whyCell;
    if (c.reasons && c.reasons.length) {
      whyCell = reasonsList(c.reasons, "cell-reasons");
    } else if (isDone) {
      whyCell = '<span class="no-gap-note">Closed out clean.</span>';
    } else {
      whyCell = '<span class="no-gap-note">Signals agree with the board &mdash; no gap.</span>';
    }

    tr.innerHTML =
      '<td><div class="cell-card"><span class="mono" style="font-size:12px;color:var(--ink-muted)">' + c.card_id + '</span><span class="title">' + escapeHtml(c.title) + '</span></div></td>' +
      '<td>' + escapeHtml(c.team_name) + '<br><span class="mono" style="font-size:11.5px;color:var(--ink-muted)">' + c.feature_id + '</span></td>' +
      '<td>' + neutralPill(boardLabel) + '</td>' +
      '<td><div class="cell-flow">' + ICONS.arrow + '</div></td>' +
      '<td>' + statusPill(c.status) + '</td>' +
      '<td>' + prCell + '</td>' +
      '<td>' + whyCell + '</td>';
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  app.appendChild(tableWrap);

  /* ---------------- footer ---------------- */
  var footer = el("footer");
  footer.innerHTML = "Generated by Sprint Confidence Gap Analyzer &middot; rule-based, zero-API-cost status &amp; reasoning &middot; mock data from pm-portfolio-mock-data";
  app.appendChild(footer);
})();
</script>
